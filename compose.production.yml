services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - map_tour_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./map-tour/server
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_PORT: 8787
      CORS_ORIGIN: ${API_CORS_ORIGIN}
      OSRM_URL: http://osrm:5000
      ADMIN_IMPORT_KEY: ${ADMIN_IMPORT_KEY:-}
      UPLOADS_DIR: /app/uploads
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - map_tour_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  osrm:
    image: osrm/osrm-backend
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/uoc-le.osrm"]
    volumes:
      - ./map-tour/routing/data:/data:ro
    profiles: ["routing"]

volumes:
  map_tour_pgdata:
  map_tour_uploads:
